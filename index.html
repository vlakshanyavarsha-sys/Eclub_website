<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Club Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #071a12,
                    #10291d
                );

            color: white;
        }

        .container {
            width: 100%;
            max-width: 500px;

            padding: 40px;

            background: #ffffff;

            color: #18201b;

            border-radius: 20px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            background: #c7ff3d;

            color: #071a12;

            border-radius: 14px;

            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            margin: 0;

            font-size: 36px;
        }

        .description {
            margin: 12px 0 30px;

            color: #68716b;

            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #d8ddd9;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #70a800;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 30px;

            background: #b7ed32;

            color: #071a12;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #c7ff3d;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;
        }

        .success {
            display: block !important;

            background: #e9fbd0;

            color: #326000;
        }

        .error {
            display: block !important;

            background: #ffe5e3;

            color: #a02018;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="logo">
            E
        </div>

        <h1>
            Join E-Club
        </h1>

        <p class="description">
            Become part of our entrepreneurship community
            and learn from founders, entrepreneurs and
            industry leaders.
        </p>


        <form id="registrationForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="rollNumber">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="rollNumber"
                    name="rollNumber"
                    placeholder="Enter your roll number"
                    required
                >

            </div>


            <button
                type="submit"
                id="submitButton"
            >
                Register for E-Club
            </button>


            <div id="message"></div>

        </form>

    </div>


    <script>

        /*
         * IMPORTANT:
         * Replace this URL with the Web App URL
         * you received from Google Apps Script.
         */

        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbzXKqz2PSBTR17olzWJ3_Dh6aMZPfzP0dIW-Hya-yMcyiiIa_s5jyn4rVIVWIhN2uSxXg/exec";


        const form =
            document.getElementById(
                "registrationForm"
            );

        const button =
            document.getElementById(
                "submitButton"
            );

        const message =
            document.getElementById(
                "message"
            );


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "name"
                    ).value.trim();


                const rollNumber =
                    document.getElementById(
                        "rollNumber"
                    ).value.trim();


                if (!name || !rollNumber) {

                    showMessage(
                        "Please enter your name and roll number.",
                        "error"
                    );

                    return;
                }


                button.disabled = true;

                button.textContent =
                    "Submitting...";


                const data = {

                    name: name,

                    rollNumber: rollNumber

                };


                try {

                    const response =
                        await fetch(
                            SCRIPT_URL,
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "text/plain;charset=utf-8"
                                },

                                body:
                                    JSON.stringify(data)

                            }
                        );


                    const result =
                        await response.json();


                    if (!result.success) {

                        throw new Error(
                            result.message ||
                            "Registration failed."
                        );

                    }


                    showMessage(
                        "Registration successful! Your details have been saved.",
                        "success"
                    );


                    form.reset();


                } catch (error) {

                    console.error(error);


                    showMessage(
                        "Something went wrong. Please try again.",
                        "error"
                    );

                }


                button.disabled = false;

                button.textContent =
                    "Register for E-Club";

            }
        );


        function showMessage(text, type) {

            message.textContent = text;

            message.className = type;

        }

    </script>

</body>

</html>
